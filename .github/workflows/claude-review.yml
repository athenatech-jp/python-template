name: Claude Review

on:
  pull_request:
    types: [labeled]

# NOTE: レビュー中に label を付け直した場合は古い実行をキャンセルして新しい実行を優先する
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # NOTE: labeled イベントは track_progress 非対応のため（anthropics/claude-code-action#1095）、過去レビューの参照は prompt 内の gh コマンドで行う
      - name: Claude PR Review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR をレビューしてください。手順:

            1. `gh pr view --comments` と `gh pr view --json reviews` で PR の説明と過去のレビュー内容を確認する
            2. `gh pr diff` で変更内容と行番号を把握する
            3. 指摘はすべて `mcp__github_inline_comment__create_inline_comment`（`confirmed: true` を指定）で該当行への inline comment として投稿する。ただし過去のレビューで既に指摘済みの内容は、未解決のまま残っていても重複して投稿しないこと

            レビュー観点:
            - バグ・ロジックの誤り
            - セキュリティ上の問題
            - パフォーマンス上の懸念
            - 保守性・可読性
            - アーキテクチャ・設計上の問題

            ルール:
            - フィードバックは日本語で、具体的かつ実行可能な内容にすること
            - ポジティブなコメントや要約コメントは不要。指摘のみを inline comment で投稿すること
            - 指摘が 1 件もない場合は何も投稿しないこと
          claude_args: |
            --model claude-sonnet-5
            --fallback-model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*)"

      # NOTE: レビュー失敗時も label を外し、再付与で再実行できるようにする
      - name: Remove trigger label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "claude-review" \
            || echo "::warning::label の削除に失敗しました（既に削除済みの可能性があります）"
